<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Gradient: Harold Cyan to Deep Sky Blue -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="ambientGlow" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Dot Radial Gradient -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <!-- Dot Halo Glow -->
    <radialGradient id="dotHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.25"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#ambientGlow)"/>

  <!-- The Letter 'F' in Brilliant Pure White -->
  <rect x="16" y="14" width="8.5" height="36" rx="4" fill="#ffffff"/>
  <rect x="16" y="14" width="31.5" height="8" rx="4" fill="#ffffff"/>
  <rect x="16" y="28.5" width="21" height="7" rx="3.5" fill="#ffffff"/>

  <!-- Signature Cyan Dot Halo & Core -->
  <circle cx="45.5" cy="46.5" r="9" fill="url(#dotHalo)"/>
  <circle cx="45.5" cy="46.5" r="5.5" fill="url(#dotGrad)"/>
</svg>